name: Diagnostic des images (temporaire)
on:
  push:
    branches: [claude/eager-hopper-bmpoeq]
    paths: [scripts/check-images.mjs, .github/workflows/check-images.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-images.mjs --data data --set m7 | tee -a "$GITHUB_STEP_SUMMARY"
