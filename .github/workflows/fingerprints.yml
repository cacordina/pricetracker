name: Empreintes des cartes (scanner)

# Empreinte d'image de chaque carte du catalogue, pour le scanner (data/fingerprints.bin, environ 750 Ko).
# - après chaque reconstruction du catalogue, et à la demande : calcul et publication sur la branche data
#   (le site est ensuite republié par la mise à jour quotidienne) ;
# - quand le calcul de l'empreinte change (sur n'importe quelle branche) : calcul et mesure de la précision, sans
#   publier hors de main (résultats dans le résumé de l'exécution et les artefacts).
on:
  workflow_run:
    workflows: ['Catalogue japonais (hebdomadaire)']
    types: [completed]
  push:
    paths:
      - site/lib/fingerprint.js
      - scripts/build-fingerprints.mjs
      - scripts/measure-fingerprints.mjs
      - .github/workflows/fingerprints.yml
  workflow_dispatch:
    inputs:
      measure:
        description: 'Mesurer aussi la précision (environ 10 minutes)'
        type: boolean
        default: false
      experiment:
        description: 'Comparer aussi les variantes sans numéro (environ 10 minutes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fingerprints:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Installer sharp (décodage des images)
        run: npm install --no-save sharp@0.33.5
      # Images des cartes gardées d'une exécution à l'autre : seules les nouvelles cartes sont téléchargées.
      - uses: actions/cache@v6
        with:
          path: .images
          key: card-images-${{ github.run_id }}
          restore-keys: card-images-
      - name: Calculer les empreintes
        run: node scripts/build-fingerprints.mjs --data data --cache .images --out out
      - name: Mesurer la précision
        if: github.event_name == 'push' || inputs.measure
        run: |
          node scripts/measure-fingerprints.mjs --data data --cache .images --out out --sample 1500
          cat out/measure.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comparer les variantes sans numéro
        if: inputs.experiment
        run: |
          node scripts/experiment-fingerprints.mjs --data data --cache .images --out out --sample 600
          cat out/experiment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: fingerprints
          path: out/
      - name: Publier sur la branche data
        if: github.ref == 'refs/heads/main'
        working-directory: data
        run: |
          cp ../out/fingerprints.bin fingerprints.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fingerprints.bin
          git diff --cached --quiet && { echo "Empreintes inchangées"; exit 0; }
          git commit -q -m "empreintes du scanner du $(date -u +%F)"
          # La mise à jour quotidienne peut avoir poussé entre-temps : on se replace dessus (fichiers différents).
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
