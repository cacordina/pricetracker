name: Catalogue japonais (hebdomadaire)

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruire le catalogue depuis TCGdex
        run: node scripts/build-catalog.mjs --out data
      - name: Enregistrer le catalogue
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "catalogue du $(date -u +%F)"; git push; }
